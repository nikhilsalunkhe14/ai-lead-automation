<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - AI Lead Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .role-super_admin {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        .role-admin {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        .role-viewer {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .status-active {
            color: #10b981;
            font-weight: 600;
        }
        .status-inactive {
            color: #ef4444;
            font-weight: 600;
        }
        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }
        .btn-delete {
            background: #ef4444;
            color: white;
        }
        .btn-delete:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }
        .btn-view {
            background: #3b82f6;
            color: white;
        }
        .btn-view:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        .table-row:hover {
            background-color: rgba(99, 102, 241, 0.05);
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <!-- Header -->
    <div class="glass-effect shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-user-shield text-2xl text-purple-600"></i>
                    <h1 class="text-2xl font-bold text-gray-800">Admin Management</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="currentAdmin" class="text-gray-600"></span>
                    <a href="/admin_dashboard" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
                    </a>
                    <a href="/admin_register" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                        <i class="fas fa-user-plus mr-2"></i>Register Admin
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-6 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="glass-effect rounded-xl p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Total Admins</p>
                        <p id="totalAdmins" class="text-3xl font-bold text-gray-800">0</p>
                    </div>
                    <i class="fas fa-users text-3xl text-purple-600"></i>
                </div>
            </div>
            <div class="glass-effect rounded-xl p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Super Admins</p>
                        <p id="superAdmins" class="text-3xl font-bold text-red-600">0</p>
                    </div>
                    <i class="fas fa-crown text-3xl text-red-600"></i>
                </div>
            </div>
            <div class="glass-effect rounded-xl p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Regular Admins</p>
                        <p id="regularAdmins" class="text-3xl font-bold text-blue-600">0</p>
                    </div>
                    <i class="fas fa-user-shield text-3xl text-blue-600"></i>
                </div>
            </div>
            <div class="glass-effect rounded-xl p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Viewers</p>
                        <p id="viewers" class="text-3xl font-bold text-green-600">0</p>
                    </div>
                    <i class="fas fa-eye text-3xl text-green-600"></i>
                </div>
            </div>
        </div>

        <!-- Admins Table -->
        <div class="glass-effect rounded-xl shadow-xl overflow-hidden">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-gray-800">Admin Users</h2>
                    <div class="flex items-center space-x-4">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Search admins..." 
                            class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        >
                        <button onclick="refreshAdmins()" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                            <i class="fas fa-sync-alt mr-2"></i>Refresh
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Login</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminsTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Admin rows will be inserted here -->
                    </tbody>
                </table>
                
                <!-- Loading State -->
                <div id="loadingState" class="text-center py-12">
                    <div class="loading-spinner"></div>
                    <p class="mt-4 text-gray-600">Loading admin users...</p>
                </div>
                
                <!-- Empty State -->
                <div id="emptyState" class="hidden text-center py-12">
                    <i class="fas fa-users text-6xl text-gray-300 mb-4"></i>
                    <p class="text-gray-600 text-lg">No admin users found</p>
                    <a href="/admin_register" class="mt-4 inline-block px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-user-plus mr-2"></i>Register First Admin
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="glass-effect rounded-xl p-6 max-w-md w-full mx-4">
            <div class="flex items-center mb-4">
                <i class="fas fa-exclamation-triangle text-red-500 text-2xl mr-3"></i>
                <h3 class="text-xl font-bold text-gray-800">Confirm Delete</h3>
            </div>
            <p id="deleteMessage" class="text-gray-600 mb-6"></p>
            <div class="flex justify-end space-x-4">
                <button onclick="closeDeleteModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition">
                    Cancel
                </button>
                <button id="confirmDeleteBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                    <i class="fas fa-trash mr-2"></i>Delete
                </button>
            </div>
        </div>
    </div>

    <script>
        let admins = [];
        let deleteAdminId = null;

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadCurrentAdmin();
            loadAdmins();
            
            // Search functionality
            document.getElementById('searchInput').addEventListener('input', function(e) {
                filterAdmins(e.target.value);
            });
        });

        // Load current admin info
        function loadCurrentAdmin() {
            const username = sessionStorage.getItem('adminUsername');
            const role = sessionStorage.getItem('adminRole');
            if (username && role) {
                document.getElementById('currentAdmin').innerHTML = `
                    <i class="fas fa-user mr-2"></i>${username} 
                    <span class="role-badge role-${role}">${role}</span>
                `;
            }
        }

        // Load all admins
        async function loadAdmins() {
            try {
                document.getElementById('loadingState').classList.remove('hidden');
                document.getElementById('emptyState').classList.add('hidden');
                
                const response = await fetch('/api/admin/list');
                const result = await response.json();
                
                if (response.ok && result.status === 'success') {
                    admins = result.admins;
                    renderAdmins();
                    updateStats();
                } else {
                    throw new Error(result.message || 'Failed to load admins');
                }
            } catch (error) {
                console.error('Error loading admins:', error);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            } finally {
                document.getElementById('loadingState').classList.add('hidden');
            }
        }

        // Render admins table
        function renderAdmins(adminsToRender = admins) {
            const tbody = document.getElementById('adminsTableBody');
            
            if (adminsToRender.length === 0) {
                tbody.innerHTML = '';
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            
            document.getElementById('emptyState').classList.add('hidden');
            
            tbody.innerHTML = adminsToRender.map(admin => `
                <tr class="table-row transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <i class="fas fa-user-circle text-gray-400 text-xl mr-3"></i>
                            <span class="font-medium text-gray-900">${admin.username}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <i class="fas fa-envelope text-gray-400 mr-2"></i>
                            <span class="text-gray-600">${admin.email}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="role-badge role-${admin.role}">${admin.role}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="${admin.is_active ? 'status-active' : 'status-inactive'}">
                            <i class="fas fa-circle text-xs mr-1"></i>
                            ${admin.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                        ${admin.last_login ? formatDate(admin.last_login) : 'Never'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                        ${admin.created_at ? formatDate(admin.created_at) : 'Unknown'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center space-x-2">
                            <button onclick="viewAdmin('${admin.id}')" class="btn-action btn-view">
                                <i class="fas fa-eye mr-1"></i>View
                            </button>
                            ${canDeleteAdmin(admin) ? `
                                <button onclick="confirmDelete('${admin.id}', '${admin.username}')" class="btn-action btn-delete">
                                    <i class="fas fa-trash mr-1"></i>Delete
                                </button>
                            ` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Check if current admin can delete the target admin
        function canDeleteAdmin(admin) {
            const currentRole = sessionStorage.getItem('adminRole');
            const currentId = sessionStorage.getItem('adminId');
            
            // Only super admins can delete
            if (currentRole !== 'super_admin') return false;
            
            // Cannot delete self
            if (admin.id === currentId) return false;
            
            return true;
        }

        // Filter admins based on search
        function filterAdmins(searchTerm) {
            const filtered = admins.filter(admin => 
                admin.username.toLowerCase().includes(searchTerm.toLowerCase()) ||
                admin.email.toLowerCase().includes(searchTerm.toLowerCase()) ||
                admin.role.toLowerCase().includes(searchTerm.toLowerCase())
            );
            renderAdmins(filtered);
        }

        // Update statistics
        function updateStats() {
            const total = admins.length;
            const superAdmins = admins.filter(a => a.role === 'super_admin').length;
            const regularAdmins = admins.filter(a => a.role === 'admin').length;
            const viewers = admins.filter(a => a.role === 'viewer').length;
            
            document.getElementById('totalAdmins').textContent = total;
            document.getElementById('superAdmins').textContent = superAdmins;
            document.getElementById('regularAdmins').textContent = regularAdmins;
            document.getElementById('viewers').textContent = viewers;
        }

        // View admin details
        function viewAdmin(adminId) {
            const admin = admins.find(a => a.id === adminId);
            if (admin) {
                alert(`Admin Details:\n\nUsername: ${admin.username}\nEmail: ${admin.email}\nRole: ${admin.role}\nStatus: ${admin.is_active ? 'Active' : 'Inactive'}\nCreated: ${formatDate(admin.created_at)}\nLast Login: ${admin.last_login ? formatDate(admin.last_login) : 'Never'}\nLogin Attempts: ${admin.login_attempts}`);
            }
        }

        // Confirm delete
        function confirmDelete(adminId, username) {
            deleteAdminId = adminId;
            document.getElementById('deleteMessage').textContent = `Are you sure you want to delete admin "${username}"? This action cannot be undone.`;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        // Close delete modal
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            deleteAdminId = null;
        }

        // Delete admin
        async function deleteAdmin() {
            if (!deleteAdminId) return;
            
            const confirmBtn = document.getElementById('confirmDeleteBtn');
            const originalText = confirmBtn.innerHTML;
            confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Deleting...';
            confirmBtn.disabled = true;
            
            try {
                const response = await fetch(`/api/admin/${deleteAdminId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (response.ok && result.status === 'success') {
                    closeDeleteModal();
                    loadAdmins(); // Refresh the list
                } else {
                    alert('Error: ' + (result.message || 'Failed to delete admin'));
                }
            } catch (error) {
                console.error('Error deleting admin:', error);
                alert('Network error. Please try again.');
            } finally {
                confirmBtn.innerHTML = originalText;
                confirmBtn.disabled = false;
            }
        }

        // Refresh admins list
        function refreshAdmins() {
            loadAdmins();
        }

        // Format date
        function formatDate(dateString) {
            if (!dateString) return 'Never';
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        // Event listeners
        document.getElementById('confirmDeleteBtn').addEventListener('click', deleteAdmin);
        
        // Close modal on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeDeleteModal();
            }
        });
        
        // Close modal on background click
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDeleteModal();
            }
        });
    </script>
</body>
</html>
