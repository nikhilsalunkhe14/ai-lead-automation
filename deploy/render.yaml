services:
  # AI Lead Automation Backend
  - type: web
    name: ai-lead-automation
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: MEMORY_DB_PATH
        value: /opt/render/project/src/memory_db
    healthCheckPath: /api/health
    autoDeploy: true
    
  # MongoDB Atlas (External Service)
  - type: pserv
    name: mongodb
    env: docker
    plan: free
    dockerfilePath: ./deploy/mongodb/Dockerfile
    envVars:
      - key: MONGO_INITDB_ROOT_USERNAME
        value: admin
      - key: MONGO_INITDB_ROOT_PASSWORD
        generateValue: true
