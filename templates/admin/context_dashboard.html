<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Analytics Dashboard - AI Lead Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .context-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .context-card:hover {
            transform: translateY(-2px);
        }
        .context-item {
            border-left: 4px solid #4f46e5;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: #f9fafb;
            border-radius: 0 8px 8px 0;
        }
        .score-bar {
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
            margin: 4px 0;
        }
        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            transition: width 0.3s ease;
        }
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            display: none;
        }
        .error-message { background: #ef4444; }
        .success-message { background: #10b981; }
        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .tab-active {
            background: #4f46e5;
            color: white;
        }
        .context-highlight {
            background: #eff6ff;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 16px;
            margin: 12px 0;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <!-- Header -->
    <div class="glass-effect shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-brain text-2xl text-purple-600"></i>
                    <h1 class="text-2xl font-bold text-gray-800">Context Analytics Dashboard</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/memory_dashboard" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-database mr-2"></i>AI Memory
                    </a>
                    <a href="/admin_dashboard" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
                    </a>
                    <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Messages -->
    <div id="errorMessage" class="message error-message"></div>
    <div id="successMessage" class="message success-message"></div>

    <!-- Main Content -->
    <div class="container mx-auto px-6 py-8">
        <!-- Context Test Interface -->
        <div class="context-card mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Context-Aware AI Test</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Test Message</label>
                    <textarea id="testMessage" rows="3" placeholder="Enter a test message..." 
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">I also want payment integration for my e-commerce website</textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Client ID</label>
                    <input type="text" id="testClientId" placeholder="client_001" value="client_001"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="testContextGeneration()" class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                    <i class="fas fa-magic mr-2"></i>Test Context AI
                </button>
                <button onclick="clearTestResults()" class="px-6 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
                    <i class="fas fa-times mr-2"></i>Clear
                </button>
                <div id="testLoading" class="loading-spinner" style="display: none;"></div>
            </div>
        </div>

        <!-- Test Results -->
        <div id="testResults" class="context-card mb-8" style="display: none;">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Context-Aware AI Results</h2>
            <div id="testResultsContent">
                <!-- Results will be displayed here -->
            </div>
        </div>

        <!-- Context Analytics -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- Context Usage Stats -->
            <div class="context-card">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Context Usage Analytics</h3>
                <div id="contextStats" class="space-y-4">
                    <!-- Stats will be loaded here -->
                </div>
            </div>

            <!-- Memory Collections Status -->
            <div class="context-card">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Memory Collections</h3>
                <div id="memoryCollections" class="space-y-4">
                    <!-- Collections status will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Context Retrieval Debug -->
        <div class="context-card mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Context Retrieval Debug</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Debug Query</label>
                    <textarea id="debugQuery" rows="2" placeholder="Enter query to debug..." 
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Client ID (Optional)</label>
                    <input type="text" id="debugClientId" placeholder="client_001"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="debugContextRetrieval()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                    <i class="fas fa-bug mr-2"></i>Debug Retrieval
                </button>
                <div id="debugLoading" class="loading-spinner" style="display: none;"></div>
            </div>
        </div>

        <!-- Debug Results -->
        <div id="debugResults" class="context-card" style="display: none;">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Debug Results</h2>
            <div id="debugResultsContent">
                <!-- Debug results will be displayed here -->
            </div>
        </div>

        <!-- Client Context Explorer -->
        <div class="context-card">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Client Context Explorer</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Client ID</label>
                    <input type="text" id="exploreClientId" placeholder="Enter client ID..."
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Limit</label>
                    <input type="number" id="exploreLimit" value="20" min="1" max="100"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                </div>
                <div class="flex items-end">
                    <button onclick="exploreClientContext()" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                        <i class="fas fa-search mr-2"></i>Explore
                    </button>
                </div>
            </div>
        </div>

        <!-- Client Context Results -->
        <div id="clientContextResults" class="context-card mt-8" style="display: none;">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Client Context Results</h2>
            <div id="clientContextContent">
                <!-- Client context will be displayed here -->
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let csrfToken = null;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', async () => {
            await getCsrfToken();
            await loadContextStats();
            await loadMemoryCollections();
        });

        // Get CSRF token
        async function getCsrfToken() {
            try {
                const response = await fetch('/api/csrf-token');
                const data = await response.json();
                csrfToken = data.csrf_token;
            } catch (error) {
                console.error('Error getting CSRF token:', error);
            }
        }

        // Test context generation
        async function testContextGeneration() {
            const message = document.getElementById('testMessage').value.trim();
            const clientId = document.getElementById('testClientId').value.trim();
            
            if (!message) {
                showError('Please enter a test message');
                return;
            }
            
            showLoading('testLoading');
            
            try {
                const response = await fetch('/api/context/test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({
                        message: message,
                        client_id: clientId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayTestResults(data);
                } else {
                    showError(data.message || 'Context test failed');
                }
            } catch (error) {
                console.error('Error testing context:', error);
                showError('Error testing context generation');
            } finally {
                hideLoading('testLoading');
            }
        }

        // Display test results
        function displayTestResults(data) {
            const resultsDiv = document.getElementById('testResults');
            const contentDiv = document.getElementById('testResultsContent');
            
            let html = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div>
                        <h4 class="font-semibold text-gray-800 mb-3">Context Information</h4>
                        <div class="space-y-2">
                            <div><strong>Message:</strong> ${data.test_message}</div>
                            <div><strong>Client ID:</strong> ${data.test_client_id}</div>
                            <div><strong>Context Used:</strong> <span class="${data.context_used ? 'text-green-600' : 'text-gray-500'}">${data.context_used ? 'Yes' : 'No'}</span></div>
                            <div><strong>Context Count:</strong> ${data.context_count}</div>
                            <div><strong>Context Summary:</strong> ${data.context_summary}</div>
                        </div>
                    </div>
                    <div>
                        <h4 class="font-semibold text-gray-800 mb-3">AI Response</h4>
                        <div class="context-highlight">
                            <div class="mb-3"><strong>Response:</strong></div>
                            <div class="text-gray-700 mb-3">${data.ai_response.response}</div>
                            ${data.ai_response.follow_up ? `
                                <div class="mb-3"><strong>Follow-up:</strong></div>
                                <div class="text-blue-600 mb-3">${data.ai_response.follow_up}</div>
                            ` : ''}
                            ${data.ai_response.context_usage_note ? `
                                <div><strong>Context Usage:</strong></div>
                                <div class="text-sm text-gray-600">${data.ai_response.context_usage_note}</div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
            
            contentDiv.innerHTML = html;
            resultsDiv.style.display = 'block';
        }

        // Debug context retrieval
        async function debugContextRetrieval() {
            const query = document.getElementById('debugQuery').value.trim();
            const clientId = document.getElementById('debugClientId').value.trim();
            
            if (!query) {
                showError('Please enter a debug query');
                return;
            }
            
            showLoading('debugLoading');
            
            try {
                const response = await fetch('/api/context/debug', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({
                        message: query,
                        client_id: clientId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayDebugResults(data);
                } else {
                    showError(data.message || 'Debug failed');
                }
            } catch (error) {
                console.error('Error debugging context:', error);
                showError('Error debugging context retrieval');
            } finally {
                hideLoading('debugLoading');
            }
        }

        // Display debug results
        function displayDebugResults(data) {
            const resultsDiv = document.getElementById('debugResults');
            const contentDiv = document.getElementById('debugResultsContent');
            
            const debugInfo = data.debug_info;
            
            let html = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div>
                        <h4 class="font-semibold text-gray-800 mb-3">Retrieval Statistics</h4>
                        <div class="space-y-2">
                            <div><strong>Raw Retrieved:</strong> ${debugInfo.raw_retrieved}</div>
                            <div><strong>After Ranking:</strong> ${debugInfo.after_ranking}</div>
                            <div><strong>In Final Context:</strong> ${debugInfo.in_final_context}</div>
                            <div><strong>Token Usage:</strong> ${debugInfo.token_usage}</div>
                        </div>
                        
                        <h4 class="font-semibold text-gray-800 mb-3 mt-4">Retrieval Sources</h4>
                        <div class="space-y-1">
            `;
            
            Object.entries(debugInfo.retrieval_sources).forEach(([source, count]) => {
                html += `<div><strong>${source}:</strong> ${count}</div>`;
            });
            
            html += `
                        </div>
                    </div>
                    <div>
                        <h4 class="font-semibold text-gray-800 mb-3">Top Ranked Memories</h4>
                        <div class="space-y-3">
            `;
            
            debugInfo.ranking_details.forEach((memory, index) => {
                html += `
                    <div class="context-item">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-medium">Rank #${memory.rank}</span>
                            <span class="text-sm text-gray-500">Score: ${memory.final_score.toFixed(3)}</span>
                        </div>
                        <div class="text-sm text-gray-600 mb-2">${memory.content_preview}</div>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div><strong>Similarity:</strong> ${memory.similarity.toFixed(3)}</div>
                            <div><strong>Relevance:</strong> ${memory.relevance_score.toFixed(3)}</div>
                            <div><strong>Importance:</strong> ${memory.importance_score.toFixed(3)}</div>
                            <div><strong>Recency:</strong> ${memory.recency_score.toFixed(3)}</div>
                        </div>
                        <div class="text-xs text-gray-500">
                            <strong>Source:</strong> ${memory.retrieval_reason}
                        </div>
                    </div>
                `;
            });
            
            html += `
                        </div>
                    </div>
                </div>
            `;
            
            contentDiv.innerHTML = html;
            resultsDiv.style.display = 'block';
        }

        // Explore client context
        async function exploreClientContext() {
            const clientId = document.getElementById('exploreClientId').value.trim();
            const limit = parseInt(document.getElementById('exploreLimit').value);
            
            if (!clientId) {
                showError('Please enter a client ID');
                return;
            }
            
            try {
                const response = await fetch(`/api/context/client/${encodeURIComponent(clientId)}?limit=${limit}`);
                const data = await response.json();
                
                if (data.success) {
                    displayClientContext(data);
                } else {
                    showError(data.message || 'Failed to get client context');
                }
            } catch (error) {
                console.error('Error exploring client context:', error);
                showError('Error getting client context');
            }
        }

        // Display client context
        function displayClientContext(data) {
            const resultsDiv = document.getElementById('clientContextResults');
            const contentDiv = document.getElementById('clientContextContent');
            
            const context = data.context;
            const clientContext = data.client_context;
            const analysis = data.analysis;
            
            let html = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div>
                        <h4 class="font-semibold text-gray-800 mb-3">Context Summary</h4>
                        <div class="space-y-2">
                            <div><strong>Total Memories:</strong> ${context.total_tokens}</div>
                            <div><strong>Retrieved Count:</strong> ${context.retrieved_count}</div>
                            <div><strong>Context Summary:</strong> ${context.summary}</div>
                        </div>
                        
                        <h4 class="font-semibold text-gray-800 mb-3 mt-4">Client Information</h4>
                        <div class="space-y-2">
                            <div><strong>Total Conversations:</strong> ${clientContext.conversations ? clientContext.conversations.length : 0}</div>
                            <div><strong>Total Projects:</strong> ${clientContext.projects ? clientContext.projects.length : 0}</div>
                        </div>
                    </div>
                    <div>
                        <h4 class="font-semibold text-gray-800 mb-3">Recent Context Items</h4>
                        <div class="space-y-2 max-h-96 overflow-y-auto">
            `;
            
            // Display top context items
            if (context.context && context.context.length > 0) {
                context.context.slice(0, 10).forEach((item, index) => {
                    const metadata = item.metadata || {};
                    html += `
                        <div class="context-item">
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-medium text-sm">Item ${index + 1}</span>
                                <span class="text-xs text-gray-500">Similarity: ${(item.similarity * 100).toFixed(1)}%</span>
                            </div>
                            <div class="text-sm text-gray-700 mb-2">${item.content}</div>
                            <div class="text-xs text-gray-500">
                                <strong>Type:</strong> ${metadata.content_type || 'text'} | 
                                <strong>Category:</strong> ${metadata.lead_category || 'unspecified'}
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div class="text-gray-500">No context items found</div>';
            }
            
            html += `
                        </div>
                    </div>
                </div>
            `;
            
            contentDiv.innerHTML = html;
            resultsDiv.style.display = 'block';
        }

        // Load context statistics
        async function loadContextStats() {
            try {
                const response = await fetch('/api/context/stats');
                const data = await response.json();
                
                if (data.success) {
                    displayContextStats(data);
                }
            } catch (error) {
                console.error('Error loading context stats:', error);
            }
        }

        // Display context statistics
        function displayContextStats(data) {
            const statsDiv = document.getElementById('contextStats');
            
            const contextStats = data.context_stats;
            
            let html = `
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Total Requests</span>
                        <span class="font-semibold">${contextStats.total_context_requests || 0}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Average Context Size</span>
                        <span class="font-semibold">${contextStats.average_context_size || 0}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Context Hit Rate</span>
                        <span class="font-semibold">${(contextStats.context_hit_rate || 0).toFixed(1)}%</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Efficiency</span>
                        <span class="font-semibold capitalize">${contextStats.context_efficiency || 'good'}</span>
                    </div>
                </div>
            `;
            
            statsDiv.innerHTML = html;
        }

        // Load memory collections
        async function loadMemoryCollections() {
            try {
                const response = await fetch('/api/memory/status');
                const data = await response.json();
                
                if (data.success) {
                    displayMemoryCollections(data.stats);
                }
            } catch (error) {
                console.error('Error loading memory collections:', error);
            }
        }

        // Display memory collections
        function displayMemoryCollections(stats) {
            const collectionsDiv = document.getElementById('memoryCollections');
            
            let html = '';
            
            if (stats.collections) {
                Object.entries(stats.collections).forEach(([name, info]) => {
                    const statusColor = info.status === 'active' ? 'text-green-600' : 'text-red-600';
                    html += `
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                            <div>
                                <div class="font-medium">${name}</div>
                                <div class="text-sm text-gray-500">Entries: ${info.count}</div>
                            </div>
                            <div class="${statusColor} font-medium">${info.status}</div>
                        </div>
                    `;
                });
            }
            
            collectionsDiv.innerHTML = html || '<div class="text-gray-500">No collections found</div>';
        }

        // Clear test results
        function clearTestResults() {
            document.getElementById('testResults').style.display = 'none';
            document.getElementById('debugResults').style.display = 'none';
            document.getElementById('clientContextResults').style.display = 'none';
            document.getElementById('testMessage').value = '';
            document.getElementById('debugQuery').value = '';
        }

        // Show/hide loading
        function showLoading(elementId) {
            document.getElementById(elementId).style.display = 'inline-block';
        }

        function hideLoading(elementId) {
            document.getElementById(elementId).style.display = 'none';
        }

        // Show messages
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        // Check authentication
        function checkAuth() {
            const isLoggedIn = sessionStorage.getItem('adminLoggedIn') === 'true';
            if (!isLoggedIn) {
                window.location.href = '/admin_login';
            }
        }

        // Logout function
        function logout() {
            sessionStorage.clear();
            window.location.href = '/admin_login';
        }

        // Check authentication on load
        checkAuth();
    </script>
</body>
</html>
