<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Memory Dashboard - AI Lead Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .memory-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .memory-card:hover {
            transform: translateY(-2px);
        }
        .similarity-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }
        .similarity-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            transition: width 0.3s ease;
        }
        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: #f3f4f6;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            color: #374151;
            margin: 2px;
        }
        .tag.hot { background: #fef2f2; color: #dc2626; }
        .tag.warm { background: #fef3c7; color: #d97706; }
        .tag.cool { background: #dbeafe; color: #2563eb; }
        .tag.cold { background: #f3f4f6; color: #6b7280; }
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            display: none;
        }
        .error-message { background: #ef4444; }
        .success-message { background: #10b981; }
        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <!-- Header -->
    <div class="glass-effect shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-brain text-2xl text-purple-600"></i>
                    <h1 class="text-2xl font-bold text-gray-800">AI Memory Dashboard</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/admin_dashboard" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
                    </a>
                    <a href="/analytics_dashboard" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-chart-line mr-2"></i>Analytics
                    </a>
                    <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Messages -->
    <div id="errorMessage" class="message error-message"></div>
    <div id="successMessage" class="message success-message"></div>

    <!-- Main Content -->
    <div class="container mx-auto px-6 py-8">
        <!-- Memory Status -->
        <div class="memory-card mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-gray-800">Memory System Status</h2>
                <button onclick="refreshMemoryStatus()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                    <i class="fas fa-sync-alt mr-2"></i>Refresh
                </button>
            </div>
            <div id="memoryStatus" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Status will be loaded here -->
            </div>
        </div>

        <!-- Search Interface -->
        <div class="memory-card mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Semantic Memory Search</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Search Query</label>
                    <input type="text" id="searchQuery" placeholder="Enter your search query..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                    <select id="searchCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                        <option value="">All Categories</option>
                        <option value="conversation">Conversations</option>
                        <option value="client">Client Profiles</option>
                        <option value="project">Projects</option>
                        <option value="general">General</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="searchMemory()" class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                    <i class="fas fa-search mr-2"></i>Search Memory
                </button>
                <button onclick="clearSearch()" class="px-6 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
                    <i class="fas fa-times mr-2"></i>Clear
                </button>
                <div id="searchLoading" class="loading-spinner" style="display: none;"></div>
            </div>
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="memory-card mb-8" style="display: none;">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Search Results</h2>
            <div id="searchResultsList">
                <!-- Results will be displayed here -->
            </div>
        </div>

        <!-- Store Memory Interface -->
        <div class="memory-card mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Store Memory Entry</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Content</label>
                    <textarea id="memoryContent" rows="4" placeholder="Enter memory content..." 
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                    <select id="memoryCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                        <option value="general">General</option>
                        <option value="conversation">Conversation</option>
                        <option value="client">Client</option>
                        <option value="project">Project</option>
                        <option value="summary">Summary</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Content Type</label>
                    <select id="memoryContentType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                        <option value="text">Text</option>
                        <option value="message">Message</option>
                        <option value="response">Response</option>
                        <option value="summary">Summary</option>
                        <option value="requirement">Requirement</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Client ID</label>
                    <input type="text" id="memoryClientId" placeholder="Optional client ID..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Lead Category</label>
                    <select id="memoryLeadCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                        <option value="unspecified">Unspecified</option>
                        <option value="hot">Hot</option>
                        <option value="warm">Warm</option>
                        <option value="cool">Cool</option>
                        <option value="cold">Cold</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="storeMemory()" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                    <i class="fas fa-save mr-2"></i>Store Memory
                </button>
                <button onclick="generateSampleData()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                    <i class="fas fa-database mr-2"></i>Generate Sample Data
                </button>
                <div id="storeLoading" class="loading-spinner" style="display: none;"></div>
            </div>
        </div>

        <!-- Client Context -->
        <div class="memory-card">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Client Context Retrieval</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Client ID</label>
                    <input type="text" id="contextClientId" placeholder="Enter client ID..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Limit</label>
                    <input type="number" id="contextLimit" value="20" min="1" max="100" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="getClientContext()" class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                    <i class="fas fa-user mr-2"></i>Get Client Context
                </button>
                <div id="contextLoading" class="loading-spinner" style="display: none;"></div>
            </div>
        </div>

        <!-- Client Context Results -->
        <div id="clientContextResults" class="memory-card mt-8" style="display: none;">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Client Context</h2>
            <div id="clientContextContent">
                <!-- Context will be displayed here -->
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let csrfToken = null;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', async () => {
            await getCsrfToken();
            await refreshMemoryStatus();
        });

        // Get CSRF token
        async function getCsrfToken() {
            try {
                const response = await fetch('/api/csrf-token');
                const data = await response.json();
                csrfToken = data.csrf_token;
            } catch (error) {
                console.error('Error getting CSRF token:', error);
            }
        }

        // Refresh memory status
        async function refreshMemoryStatus() {
            try {
                const response = await fetch('/api/memory/status');
                const data = await response.json();
                
                if (data.success) {
                    displayMemoryStatus(data.stats);
                } else {
                    showError('Failed to load memory status');
                }
            } catch (error) {
                console.error('Error refreshing memory status:', error);
                showError('Error loading memory status');
            }
        }

        // Display memory status
        function displayMemoryStatus(stats) {
            const statusDiv = document.getElementById('memoryStatus');
            
            let html = '';
            
            // Overall status
            const statusColor = stats.status === 'active' ? 'text-green-600' : 'text-red-600';
            const statusIcon = stats.status === 'active' ? 'fa-check-circle' : 'fa-exclamation-circle';
            
            html += `
                <div class="text-center">
                    <i class="fas ${statusIcon} text-3xl ${statusColor} mb-2"></i>
                    <div class="font-semibold">Memory System</div>
                    <div class="${statusColor}">${stats.status}</div>
                </div>
            `;
            
            // Collection stats
            if (stats.collections) {
                Object.entries(stats.collections).forEach(([name, info]) => {
                    const countColor = info.status === 'active' ? 'text-green-600' : 'text-red-600';
                    html += `
                        <div class="text-center">
                            <i class="fas fa-database text-2xl text-blue-600 mb-2"></i>
                            <div class="font-semibold">${name}</div>
                            <div class="${countColor}">${info.count} entries</div>
                        </div>
                    `;
                });
            }
            
            // Embedding model info
            if (stats.embedding_model) {
                html += `
                    <div class="text-center">
                        <i class="fas fa-brain text-2xl text-purple-600 mb-2"></i>
                        <div class="font-semibold">Embedding Model</div>
                        <div class="text-gray-600">${stats.embedding_model.model_name}</div>
                        <div class="text-sm text-gray-500">Dimension: ${stats.embedding_model.dimension}</div>
                    </div>
                `;
            }
            
            statusDiv.innerHTML = html;
        }

        // Search memory
        async function searchMemory() {
            const query = document.getElementById('searchQuery').value.trim();
            const category = document.getElementById('searchCategory').value;
            
            if (!query) {
                showError('Please enter a search query');
                return;
            }
            
            showLoading('searchLoading');
            
            try {
                const response = await fetch('/api/memory/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({
                        query: query,
                        category: category || null,
                        limit: 20
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displaySearchResults(data.results, data.query);
                } else {
                    showError(data.message || 'Search failed');
                }
            } catch (error) {
                console.error('Error searching memory:', error);
                showError('Error searching memory');
            } finally {
                hideLoading('searchLoading');
            }
        }

        // Display search results
        function displaySearchResults(results, query) {
            const resultsDiv = document.getElementById('searchResults');
            const resultsList = document.getElementById('searchResultsList');
            
            if (results.length === 0) {
                resultsList.innerHTML = `
                    <div class="text-center text-gray-500 py-8">
                        <i class="fas fa-search text-4xl mb-4"></i>
                        <p>No results found for "${query}"</p>
                    </div>
                `;
            } else {
                let html = '';
                results.forEach((result, index) => {
                    const similarity = (result.similarity * 100).toFixed(1);
                    const tags = result.metadata.tags || [];
                    const leadCategory = result.metadata.lead_category || 'unspecified';
                    
                    html += `
                        <div class="border-l-4 border-purple-500 pl-4 mb-6">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center space-x-2">
                                    <span class="text-sm font-semibold text-gray-600">Result ${index + 1}</span>
                                    <span class="tag ${leadCategory}">${leadCategory}</span>
                                    ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                </div>
                                <div class="text-sm text-gray-500">
                                    Similarity: ${similarity}%
                                </div>
                            </div>
                            <div class="similarity-bar mb-3">
                                <div class="similarity-fill" style="width: ${similarity}%"></div>
                            </div>
                            <p class="text-gray-800 mb-2">${result.content}</p>
                            <div class="text-xs text-gray-500">
                                Collection: ${result.collection} | 
                                Type: ${result.metadata.content_type} | 
                                Created: ${new Date(result.metadata.created_at).toLocaleString()}
                            </div>
                        </div>
                    `;
                });
                
                resultsList.innerHTML = html;
            }
            
            resultsDiv.style.display = 'block';
        }

        // Store memory
        async function storeMemory() {
            const content = document.getElementById('memoryContent').value.trim();
            const category = document.getElementById('memoryCategory').value;
            const contentType = document.getElementById('memoryContentType').value;
            const clientId = document.getElementById('memoryClientId').value.trim();
            const leadCategory = document.getElementById('memoryLeadCategory').value;
            
            if (!content) {
                showError('Please enter memory content');
                return;
            }
            
            showLoading('storeLoading');
            
            try {
                const response = await fetch('/api/memory/store', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({
                        content: content,
                        category: category,
                        content_type: contentType,
                        client_id: clientId || null,
                        lead_category: leadCategory
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Memory stored successfully');
                    clearMemoryForm();
                    await refreshMemoryStatus();
                } else {
                    showError(data.message || 'Failed to store memory');
                }
            } catch (error) {
                console.error('Error storing memory:', error);
                showError('Error storing memory');
            } finally {
                hideLoading('storeLoading');
            }
        }

        // Generate sample data
        async function generateSampleData() {
            if (!confirm('This will generate sample memory data for testing. Continue?')) {
                return;
            }
            
            showLoading('storeLoading');
            
            try {
                const response = await fetch('/api/memory/sample-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Sample data generated successfully');
                    await refreshMemoryStatus();
                } else {
                    showError(data.message || 'Failed to generate sample data');
                }
            } catch (error) {
                console.error('Error generating sample data:', error);
                showError('Error generating sample data');
            } finally {
                hideLoading('storeLoading');
            }
        }

        // Get client context
        async function getClientContext() {
            const clientId = document.getElementById('contextClientId').value.trim();
            const limit = parseInt(document.getElementById('contextLimit').value);
            
            if (!clientId) {
                showError('Please enter a client ID');
                return;
            }
            
            showLoading('contextLoading');
            
            try {
                const response = await fetch(`/api/memory/client/${encodeURIComponent(clientId)}/context?limit=${limit}`);
                const data = await response.json();
                
                if (data.success) {
                    displayClientContext(data.context);
                } else {
                    showError(data.message || 'Failed to get client context');
                }
            } catch (error) {
                console.error('Error getting client context:', error);
                showError('Error getting client context');
            } finally {
                hideLoading('contextLoading');
            }
        }

        // Display client context
        function displayClientContext(context) {
            const contextDiv = document.getElementById('clientContextResults');
            const contextContent = document.getElementById('clientContextContent');
            
            let html = `
                <div class="mb-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">Context Summary</h3>
                    <p class="text-gray-600">${context.summary}</p>
                </div>
            `;
            
            if (context.conversations && context.conversations.length > 0) {
                html += `
                    <div class="mb-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-2">Conversations (${context.conversations.length})</h3>
                        <div class="space-y-3">
                `;
                
                context.conversations.slice(0, 5).forEach(conv => {
                    const similarity = (conv.similarity * 100).toFixed(1);
                    html += `
                        <div class="border-l-4 border-blue-500 pl-4">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-sm text-gray-500">Similarity: ${similarity}%</span>
                                <span class="text-xs text-gray-400">${new Date(conv.metadata.created_at).toLocaleString()}</span>
                            </div>
                            <p class="text-gray-700">${conv.content}</p>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            if (context.projects && context.projects.length > 0) {
                html += `
                    <div class="mb-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-2">Related Projects (${context.projects.length})</h3>
                        <div class="space-y-3">
                `;
                
                context.projects.forEach(project => {
                    const similarity = (project.similarity * 100).toFixed(1);
                    html += `
                        <div class="border-l-4 border-green-500 pl-4">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-sm text-gray-500">Similarity: ${similarity}%</span>
                                <span class="text-xs text-gray-400">${new Date(project.metadata.created_at).toLocaleString()}</span>
                            </div>
                            <p class="text-gray-700">${project.content}</p>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            contextContent.innerHTML = html;
            contextDiv.style.display = 'block';
        }

        // Clear search
        function clearSearch() {
            document.getElementById('searchQuery').value = '';
            document.getElementById('searchCategory').value = '';
            document.getElementById('searchResults').style.display = 'none';
        }

        // Clear memory form
        function clearMemoryForm() {
            document.getElementById('memoryContent').value = '';
            document.getElementById('memoryClientId').value = '';
            document.getElementById('memoryCategory').value = 'general';
            document.getElementById('memoryContentType').value = 'text';
            document.getElementById('memoryLeadCategory').value = 'unspecified';
        }

        // Show/hide loading
        function showLoading(elementId) {
            document.getElementById(elementId).style.display = 'inline-block';
        }

        function hideLoading(elementId) {
            document.getElementById(elementId).style.display = 'none';
        }

        // Show messages
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        // Check authentication
        function checkAuth() {
            const isLoggedIn = sessionStorage.getItem('adminLoggedIn') === 'true';
            if (!isLoggedIn) {
                window.location.href = '/admin_login';
            }
        }

        // Logout function
        function logout() {
            sessionStorage.clear();
            window.location.href = '/admin_login';
        }

        // Check authentication on load
        checkAuth();
    </script>
</body>
</html>
