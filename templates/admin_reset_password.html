<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI Lead Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            padding: 50px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 48px;
            margin-bottom: 30px;
            color: #4f46e5;
        }

        .reset-title {
            font-size: 28px;
            color: #1e293b;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .reset-subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .reset-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .reset-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }

        .reset-button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
            display: none;
        }

        .success-message {
            background: #f0fdf4;
            color: #16a34a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bbf7d0;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #4f46e5;
        }

        .token-info {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #6b7280;
            word-break: break-all;
        }

        @media (max-width: 768px) {
            .reset-container {
                padding: 30px;
                margin: 20px;
            }
            
            .reset-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">🔐</div>
        <h1 class="reset-title">Reset Password</h1>
        <p class="reset-subtitle">Enter your new password to complete the reset process</p>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        {% if token %}
        <div class="token-info">
            <strong>Reset Token:</strong> {{ token }}
        </div>
        {% endif %}
        
        <form id="reset-form" onsubmit="handleReset(event)">
            <div class="form-group">
                <label for="password">New Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder="Enter your new password"
                >
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    required 
                    placeholder="Confirm your new password"
                >
            </div>
            
            <button type="submit" class="reset-button" id="resetBtn">
                <span id="btnText">Reset Password</span>
                <div id="spinner" class="hidden" style="display: inline; margin-left: 10px;">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
            </button>
        </form>
        
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
            <a href="/admin_login" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        // Password visibility toggle (optional enhancement)
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        // Form validation
        function validateForm() {
            let isValid = true;
            
            // Password validation
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('error-message');
            
            if (password.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters long';
                errorDiv.style.display = 'block';
                isValid = false;
            } else if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                isValid = false;
            } else if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)/.test(password)) {
                errorDiv.textContent = 'Password must include uppercase, lowercase, and numbers';
                errorDiv.style.display = 'block';
                isValid = false;
            } else {
                errorDiv.style.display = 'none';
            }
            
            return isValid;
        }

        // Form submission
        async function handleReset(event) {
            event.preventDefault();
            
            if (!validateForm()) {
                return;
            }
            
            const resetBtn = document.getElementById('resetBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const successDiv = document.getElementById('success-message');
            const errorDiv = document.getElementById('error-message');
            
            // Show loading state
            resetBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = 'Resetting...';
            
            // Hide previous messages
            successDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            
            const formData = {
                password: document.getElementById('password').value,
                confirm_password: document.getElementById('confirmPassword').value
            };
            
            try {
                const token = '{{ token }}';  // Get token from template
                const response = await fetch(`/api/admin/reset-password/${token}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // Success
                    successDiv.textContent = result.message || 'Password has been reset successfully!';
                    successDiv.style.display = 'block';
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/admin_login';
                    }, 2000);
                } else {
                    // Error
                    errorDiv.textContent = result.message || 'Password reset failed';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                // Reset button state
                resetBtn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = 'Reset Password';
            }
        }

        // Check if token is provided
        document.addEventListener('DOMContentLoaded', function() {
            const token = '{{ token }}';
            if (!token || token === 'None') {
                document.getElementById('error-message').textContent = 'Invalid or missing reset token';
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('reset-form').style.display = 'none';
            }
        });
    </script>
</body>
</html>
