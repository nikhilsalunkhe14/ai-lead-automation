<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AI Lead Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            padding: 50px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 48px;
            margin-bottom: 30px;
            color: #4f46e5;
        }

        .login-title {
            font-size: 28px;
            color: #1e293b;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .login-subtitle {
            color: #64748b;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
            display: none;
        }

        .success-message {
            background: #f0fdf4;
            color: #16a34a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bbf7d0;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #4f46e5;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 30px;
                margin: 20px;
            }
            
            .login-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔐</div>
        <h1 class="login-title">Admin Login</h1>
        <p class="login-subtitle">Access your admin dashboard to manage leads and reports</p>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="login-button">
                Login to Dashboard
            </button>
        </form>
        
        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
            <a href="/admin_register" class="back-link" style="display: block; margin-bottom: 10px;">
                <i class="fas fa-user-plus"></i> Don't have an account? Register
            </a>
            <a href="#" onclick="showForgotPassword()" class="back-link" style="display: block; margin-bottom: 10px;">
                <i class="fas fa-key"></i> Forgot Password?
            </a>
            <a href="/" class="back-link">
                <i class="fas fa-home"></i> ← Back to Home
            </a>
        </div>
        
        <!-- Forgot Password Modal -->
        <div id="forgotPasswordModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
            <div style="background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; position: relative;">
                <h3 style="margin-bottom: 20px; color: #1e293b;">
                    <i class="fas fa-key"></i> Reset Password
                </h3>
                
                <div id="forgotError" class="error-message" style="display: none; margin-bottom: 15px;"></div>
                <div id="forgotSuccess" class="success-message" style="display: none; margin-bottom: 15px;"></div>
                
                <div class="form-group">
                    <label for="resetEmail" style="display: block; color: #374151; font-weight: 500; margin-bottom: 8px; font-size: 14px;">
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="resetEmail" 
                        placeholder="Enter your admin email"
                        style="width: 100%; padding: 15px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 16px; transition: all 0.3s ease;"
                    >
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button onclick="submitPasswordReset()" style="flex: 1; padding: 12px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;">
                        <i class="fas fa-paper-plane"></i> Send Reset Link
                    </button>
                    <button onclick="closeForgotPassword()" style="padding: 12px 20px; background: #6b7280; color: white; border: none; border-radius: 10px; font-size: 14px; cursor: pointer;">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const loginBtn = document.querySelector('.login-button');
            const btnText = loginBtn.textContent;
            
            // Hide previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Show loading state
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            
            try {
                // Call actual login API
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.status === 'success') {
                    // Store login session
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    sessionStorage.setItem('adminUsername', result.user.username);
                    sessionStorage.setItem('adminRole', result.user.role);
                    
                    // Show success message
                    successDiv.textContent = result.message || 'Login successful! Redirecting to dashboard...';
                    successDiv.style.display = 'block';
                    
                    // Redirect to admin dashboard
                    setTimeout(() => {
                        window.location.href = result.redirect || '/admin_dashboard';
                    }, 1500);
                } else {
                    // Show error message
                    errorDiv.textContent = result.message || 'Invalid username or password. Please try again.';
                    errorDiv.style.display = 'block';
                    
                    // Clear password field
                    document.getElementById('password').value = '';
                }
            } catch (error) {
                // Show error message
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                
                // Clear password field
                document.getElementById('password').value = '';
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                loginBtn.textContent = btnText;
            }
        }

        // Forgot Password Functions
        function showForgotPassword() {
            document.getElementById('forgotPasswordModal').style.display = 'flex';
        }

        function closeForgotPassword() {
            document.getElementById('forgotPasswordModal').style.display = 'none';
            document.getElementById('resetEmail').value = '';
            document.getElementById('forgotError').style.display = 'none';
            document.getElementById('forgotSuccess').style.display = 'none';
        }

        async function submitPasswordReset() {
            const email = document.getElementById('resetEmail').value.trim();
            const errorDiv = document.getElementById('forgotError');
            const successDiv = document.getElementById('forgotSuccess');
            
            // Validate email
            if (!email) {
                errorDiv.textContent = 'Please enter your email address';
                errorDiv.style.display = 'block';
                successDiv.style.display = 'none';
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorDiv.textContent = 'Please enter a valid email address';
                errorDiv.style.display = 'block';
                successDiv.style.display = 'none';
                return;
            }
            
            // Show loading state
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            try {
                // Simulate API call (in production, this would call your backend)
                const response = await fetch('/api/admin/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    successDiv.textContent = 'Password reset link has been sent to your email. Please check your inbox.';
                    successDiv.style.display = 'block';
                    
                    // Clear form and close modal after 3 seconds
                    setTimeout(() => {
                        closeForgotPassword();
                    }, 3000);
                } else {
                    const error = await response.json();
                    errorDiv.textContent = error.message || 'Failed to send reset link. Please try again.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again later.';
                errorDiv.style.display = 'block';
            }
        }

        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('forgotPasswordModal');
            if (event.target === modal) {
                closeForgotPassword();
            }
        });

        // Check if already logged in
        window.addEventListener('load', () => {
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                window.location.href = '/admin_dashboard';
            }
        });
    </script>
</body>
</html>
